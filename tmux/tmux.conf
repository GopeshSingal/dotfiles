# --- Pane Switching ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy Mode --- #
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g status-style "bg=#161821,fg=#c6c8d1"
set -g status-left-length 32
set -g status-right-length 48
set -g status-left "#[fg=#161821,bg=#84a0c6,bold] #S #[fg=#84a0c6,bg=#161821] "
set -g status-right "#[fg=#6b7089]%Y-%m-%d  %H:%M "
set -g window-status-format "#[fg=#6b7089] #I:#W "
set -g window-status-current-format "#[fg=#84a0c6,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#2a3158"
set -g pane-active-border-style "fg=#84a0c6"
set -g message-style "bg=#1e2132,fg=#c6c8d1"
set -g message-command-style "bg=#1e2132,fg=#84a0c6"
set -g mode-style "bg=#1e2132,fg=#84a0c6"

# --- Throwaway shell ---
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# --- Search this pane ---
bind / copy-mode \; command-prompt -p "search this pane" "send -X search-backward \"%%%\""

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ~/.config/tmux is a symlink into this repo; without this, TPM looks for
# plugins in ~/.dotfiles/tmux/plugins instead of ~/.tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'tab'

run '~/.tmux/plugins/tpm/tpm'
