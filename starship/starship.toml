format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
truncation_length = 3
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
